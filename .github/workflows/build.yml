name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Unzip sources
        run: |
          unzip -o aweme-comment-ios.zip -d src_unzipped
          find src_unzipped -type f | sort

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          ROOT=$(dirname "$(dirname "$(find src_unzipped -name Tweak.m | head -1)")")
          echo "ROOT=$ROOT"
          ls -la "$ROOT"
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -install_name @executable_path/Frameworks/AwemeComment.dylib \
            -framework Foundation -framework UIKit \
            -I "$ROOT/include" \
            -O2 \
            -o out/AwemeComment.dylib \
            "$ROOT/src/Tweak.m" "$ROOT/src/RuleEngine.m" "$ROOT/src/ACProbeShower.m"

      - name: Verify
        run: |
          file out/AwemeComment.dylib
          xcrun -sdk iphoneos otool -L out/AwemeComment.dylib
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AwemeComment-dylib
          path: out/AwemeComment.dylib
