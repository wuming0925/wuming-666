name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o aweme-comment-ios.zip -d src_unzipped

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm make
          ld.lld --version
          ls /usr/bin | grep -E "^llvm-lipo|lld" | head -5

      - name: SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git s
          cd s && git sparse-checkout set iPhoneOS16.5.sdk
          echo "SDK=$PWD/iPhoneOS16.5.sdk" >> $GITHUB_ENV

      - name: Probe lld options
        run: |
          ROOT=src_unzipped
          set +e
          echo "=== try -adhoc_codesign arm64 ==="
          clang -target arm64-apple-ios15.0 -dynamiclib -fobjc-arc \
            -isysroot "$SDK" -F"$SDK/System/Library/Frameworks" \
            -install_name @executable_path/Frameworks/AwemeComment.dylib \
            -framework Foundation -framework UIKit \
            -I "$ROOT/include" -I "$ROOT/src" -O2 -fuse-ld=lld \
            -Wl,-adhoc_codesign \
            -o /tmp/a64.dylib "$ROOT/src/Tweak.m" "$ROOT/src/RuleEngine.m" "$ROOT/src/ACProbeShower.m" 2>&1 | tail -6
          echo "rc_arm64=$?"
          file /tmp/a64.dylib
          llvm-objdump --macho --private-headers /tmp/a64.dylib 2>/dev/null | grep -i "LC_CODE_SIGNATURE" | head -3

          echo "=== try arm64e ==="
          clang -target arm64e-apple-ios15.0 -dynamiclib -fobjc-arc \
            -isysroot "$SDK" -F"$SDK/System/Library/Frameworks" \
            -install_name @executable_path/Frameworks/AwemeComment.dylib \
            -framework Foundation -framework UIKit \
            -I "$ROOT/include" -I "$ROOT/src" -O2 -fuse-ld=lld \
            -Wl,-adhoc_codesign \
            -o /tmp/a64e.dylib "$ROOT/src/Tweak.m" "$ROOT/src/RuleEngine.m" "$ROOT/src/ACProbeShower.m" 2>&1 | tail -8
          echo "rc_arm64e=$?"
          file /tmp/a64e.dylib 2>/dev/null

          echo "=== lipo ==="
          LIPO=$(ls /usr/bin/llvm-lipo* 2>/dev/null | head -1)
          echo "LIPO=$LIPO"
          if [ -f /tmp/a64e.dylib ] && [ -n "$LIPO" ]; then
            "$LIPO" -create -output /tmp/fat.dylib /tmp/a64.dylib /tmp/a64e.dylib && echo LIPO_OK
            "$LIPO" -info /tmp/fat.dylib
            file /tmp/fat.dylib
          fi

      - name: Try build ldid
        run: |
          set +e
          sudo apt-get install -y -qq libplist-dev libssl-dev pkg-config
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git l
          cd l && make -j4 2>&1 | tail -15
          ls -la | grep -i ldid
          find . -maxdepth 2 -name "ldid" -type f -perm -u+x | head -3
