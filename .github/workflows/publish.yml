name: build-and-publish

# 编译后自动把 dylib 提交回仓库根目录，
# 这样在 GitHub 网页的仓库页面就能直接点开下载，不用去 Actions Artifacts。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip sources
        run: |
          unzip -o aweme-comment-ios.zip -d src_unzipped
          find src_unzipped -type f | sort

      - name: Install iOS cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm make
          clang --version | head -1

      - name: Fetch iOS SDK from theos/sdks
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git sdk-repo
          cd sdk-repo
          git sparse-checkout set iPhoneOS15.6.sdk
          ls -d iPhoneOS*.sdk
          SDK=$PWD/$(ls -d iPhoneOS*.sdk | head -1)
          echo "SDK=$SDK" >> $GITHUB_ENV

      - name: Compile dylib
        run: |
          ROOT=$(dirname "$(dirname "$(find src_unzipped -name Tweak.m | head -1)")")
          echo "ROOT=$ROOT"
          ls "$ROOT"
          mkdir -p out
          clang \
            -target arm64-apple-ios15.0 \
            -dynamiclib \
            -fobjc-arc \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -install_name @executable_path/Frameworks/AwemeComment.dylib \
            -framework Foundation -framework UIKit \
            -I "$ROOT/include" -I "$ROOT/src" \
            -O2 -fuse-ld=lld \
            -o out/AwemeComment.dylib \
            "$ROOT/src/Tweak.m" "$ROOT/src/RuleEngine.m" "$ROOT/src/ACProbeShower.m"

      - name: Verify
        run: |
          file out/AwemeComment.dylib
          llvm-objdump --macho --private-headers out/AwemeComment.dylib | head -40 || true
          llvm-objdump --macho --dylibs-used out/AwemeComment.dylib || true
          ls -la out

      # 关键一步：把产物提交回仓库，网页上直接可见、可下载
      - name: Publish dylib to repo root
        run: |
          cp out/AwemeComment.dylib ./AwemeComment.dylib
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AwemeComment.dylib
          git commit -m "chore: build AwemeComment.dylib [skip ci]" || echo "no change"
          git push || echo "push failed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwemeComment-dylib
          path: out/AwemeComment.dylib
